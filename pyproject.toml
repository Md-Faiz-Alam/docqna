[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docqna"
version = "0.1.0"
description = "Production-oriented document question answering system using hybrid RAG."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",

    "ollama==0.6.2",

    "pypdf==6.19.0",
    "python-docx==1.2.0",

    "sentence-transformers==6.1.0",
    "chromadb==1.5.9",

    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "python-multipart==0.0.32",

    "streamlit==1.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ollama:
    image: ollama/ollama:0.34.1
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NO_CLOUD: "true"
    mem_limit: 5g
    logging: *default-logging
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  ollama-init:
    image: ollama/ollama:0.34.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$OLLAMA_MODEL\""]
    restart: "no"
    mem_limit: 512m
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000

      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}

      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DEVICE: cpu
      EMBEDDING_BATCH_SIZE: 32

      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      MAX_QUESTION_CHARS: ${MAX_QUESTION_CHARS:-2000}
      MAX_DOCUMENTS_PER_SESSION: ${MAX_DOCUMENTS_PER_SESSION:-3}
      MAX_ACTIVE_DOCUMENTS: ${MAX_ACTIVE_DOCUMENTS:-25}
      MAX_CHUNKS_PER_DOCUMENT: ${MAX_CHUNKS_PER_DOCUMENT:-1000}
      DOCUMENT_RETENTION_HOURS: ${DOCUMENT_RETENTION_HOURS:-24}

      # Keep third-party model/index telemetry disabled in the
      # self-hosted public deployment.
      ANONYMIZED_TELEMETRY: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"

      LOG_LEVEL: INFO
      LOG_TO_FILE: "false"

    mem_limit: 5g
    logging: *default-logging

    volumes:
      - docqna_indexes:/app/data/indexes
      - docqna_metadata:/app/data/metadata
      - huggingface_cache:/app/.cache/huggingface

    expose:
      - "8000"

    # Diagnostics remain available from the VM itself, but FastAPI is
    # not directly exposed to the public network.
    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOCQNA_API_URL: http://api:8000
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE_MB:-20}
      DOCQNA_MAX_QUESTION_CHARS: ${MAX_QUESTION_CHARS:-2000}

    mem_limit: 512m
    logging: *default-logging

    # The public reverse proxy added on the VM will be the only
    # internet-facing entry point. Streamlit stays host-local.
    ports:
      - "127.0.0.1:8501:8501"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ollama_data:
  docqna_indexes:
  docqna_metadata:
  huggingface_cache:

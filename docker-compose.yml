services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull phi3:mini"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000

      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: phi3:mini

      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DEVICE: cpu
      EMBEDDING_BATCH_SIZE: 32

      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}

      LOG_LEVEL: INFO
      LOG_TO_FILE: "false"

    volumes:
      - docqna_indexes:/app/data/indexes
      - docqna_metadata:/app/data/metadata
      - huggingface_cache:/root/.cache/huggingface

    expose:
      - "8000"

    # Localhost-only host binding: useful for diagnostics without publicly
    # exposing FastAPI when this Compose file is used on a server.
    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOCQNA_API_URL: http://api:8000
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE_MB:-20}
    ports:
      - "8501:8501"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ollama_data:
  docqna_indexes:
  docqna_metadata:
  huggingface_cache:

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # CPU-only torch keeps the CI install small and fast.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests experiments scripts

      - name: Ruff format
        run: ruff format --check src tests experiments scripts

      - name: Mypy
        run: mypy

      - name: Unit tests
        # Unit tests use fakes only: no model downloads, no Ollama.
        run: pytest --cov --cov-report=term --cov-fail-under=75

  benchmark:
    name: Retrieval quality gate
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      ANONYMIZED_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-models-${{ hashFiles('src/docqna/settings.py') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Public benchmark (fails below data/evaluation/public/thresholds.json)
        # Production retrieval stack on CPU, no LLM: deterministic and free.
        run: python -m docqna.evaluation.public_benchmark --check

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-benchmark-report
          path: data/evaluation/results/public_benchmark.json

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/streamlit.Dockerfile
          push: false
